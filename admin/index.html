<style>
:root{
  --bg:#F5F3F2;--surface:#FFFFFF;--sunk:#EEEAE8;--ink:#1B1618;--muted:#6C6266;--line:#E4DDDA;--grid:#EDE8E6;
  --wine:#7A1F3D;--wine-ink:#FFFFFF;--wine-soft:#F4E6EB;--good:#24724F;--good-soft:#E3F1EA;--bad:#B0261E;--bad-soft:#F9E3E1;--warn:#9A5A0A;--warn-soft:#F8EBD7;
  /* màu biểu đồ: bảng màu đã kiểm tra mù màu, thứ tự cố định */
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--other:#A8A6A0;
  --pos:#2a78d6;--neg:#e34948;--total:#52514e;
  --display:"Bodoni Moda","Didot",Georgia,serif;--body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121011;--surface:#1C181A;--sunk:#252022;--ink:#F2ECEE;--muted:#A3989C;--line:#332C2F;--grid:#2A2426;
  --wine:#D9759A;--wine-ink:#1B0C12;--wine-soft:#3A1E29;--good:#63C496;--good-soft:#163026;--bad:#F2786E;--bad-soft:#3A1715;--warn:#E7A85A;--warn-soft:#35260F;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--other:#6B6A64;
  --pos:#3987e5;--neg:#e66767;--total:#c3c2b7;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121011;--surface:#1C181A;--sunk:#252022;--ink:#F2ECEE;--muted:#A3989C;--line:#332C2F;--grid:#2A2426;
  --wine:#D9759A;--wine-ink:#1B0C12;--wine-soft:#3A1E29;--good:#63C496;--good-soft:#163026;--bad:#F2786E;--bad-soft:#3A1715;--warn:#E7A85A;--warn-soft:#35260F;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--other:#6B6A64;
  --pos:#3987e5;--neg:#e66767;--total:#c3c2b7;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .r1{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px}
.mark{font-family:var(--display);font-weight:500;letter-spacing:.28em;font-size:18px}
.mark small{font-family:var(--body);letter-spacing:.04em;font-size:12px;color:var(--muted);margin-left:8px}
.links{display:flex;gap:14px;font-size:12.5px}
.links a{color:var(--wine);font-weight:600;text-decoration:none}
.r2{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding-block:6px 10px}
.syncchip{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.syncchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.syncchip.live{color:var(--good)}.syncchip.live::before{background:var(--good)}
.syncchip.warn{color:var(--warn)}.syncchip.warn::before{background:var(--warn)}
main{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:500;font-size:26px;margin:0;line-height:1.15}
h2{font-size:14px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.note{color:var(--muted);font-size:12.5px;margin:0}

/* bộ lọc thời gian: một hàng phía trên biểu đồ */
.period{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.custom{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.custom label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px;min-width:0}
.custom input{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface);min-width:0;width:100%;max-width:100%;box-sizing:border-box;display:block;-webkit-appearance:none;appearance:none;min-height:38px;color:var(--ink);font:inherit;font-size:14px}
.custom input::-webkit-date-and-time-value{text-align:left}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--sunk);font-weight:600}

/* lưới bảng điều khiển */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.kpi.hero{grid-column:1/-1}
@media(min-width:900px){.kpi.hero{grid-column:auto}}
.kpi.hero .v{font-size:34px}
.kpi .d{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.kpi .d b{font-weight:600}
.kpi .d.up b{color:var(--good)}.kpi .d.down b{color:var(--bad)}
.grid2{display:grid;gap:16px}
@media(min-width:900px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .hd .tb{border:0;background:none;color:var(--wine);font-size:12px;font-weight:600;padding:2px 0;white-space:nowrap}
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover+.mk,.chart [data-on="1"]{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:5;transform:translate(-50%,calc(-100% - 8px));display:none}
.tip b{font-weight:600}
.tview{overflow-x:auto}
.tview table{border-collapse:collapse;width:100%;font-size:12.5px}
.tview th,.tview td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tview th:first-child,.tview td:first-child{text-align:left}
.tview th{color:var(--muted);font-weight:500}
/* donut */
.donut{display:grid;grid-template-columns:1fr;gap:14px;align-items:center}
.donut svg{max-width:190px;margin:0 auto;width:100%}
@media(min-width:520px){.donut{grid-template-columns:minmax(140px,180px) 1fr}}
.dl{display:flex;flex-direction:column;gap:6px;min-width:0}
.dl .it{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:3px 4px;border-radius:6px}
.dl .it i{width:10px;height:10px;border-radius:2px}
.dl .it span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .it b{font-weight:600}
.dl .it small{color:var(--muted);font-weight:400;margin-left:4px}
.dl .it.on{background:var(--sunk)}
/* thanh ngang */
.hb{display:flex;flex-direction:column;gap:9px}
.hb .row{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb .row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{position:relative;height:14px}
.hb .bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hb .mk100{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1.5px dashed var(--muted)}
.hb b{font-weight:600;font-size:12.5px;min-width:4.5em;text-align:right}
/* P&L có thanh tỷ lệ */
.pl{display:flex;flex-direction:column}
.ht{display:flex;flex-direction:column}
.hs{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hs .hn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--sunk);color:var(--muted)}
.hs.on .hn{background:var(--pos);color:var(--bg)}
.hs .hb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.hs .hb b{font-size:14.5px;text-align:left;display:block;width:auto;margin:0}
.hs .hv{flex:none;font-size:16px;font-weight:700;color:var(--muted);text-align:right}
.hs.on .hv{color:var(--pos)}
.hd{padding-top:10px}
.hd .hr{display:grid;grid-template-columns:1fr auto 3.2em;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.hd .hr b{text-align:right}.hd .hr small{text-align:right;color:var(--muted)}
.pl .ln{display:grid;grid-template-columns:1fr 6.5em 3.6em;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.pl .ln b{text-align:right;font-weight:600}
.pl .ln .nm b{text-align:left}
.pl .ln small{text-align:right;color:var(--muted)}
.pl .ln.tot{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
.pl .ln .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.pl .ln .mb{height:4px;border-radius:2px;background:var(--sunk);position:relative;overflow:hidden}
.pl .ln .mb i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
/* stacked kho */
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
/* nhập liệu */
.form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);font-size:15px;color:var(--ink);min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--sunk);padding:6px 10px;border-radius:8px;font-size:15px;font-weight:600;letter-spacing:.02em}
.err{color:var(--bad);font-size:12.5px}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13px;background:var(--sunk)}.banner.bad{background:var(--wine-soft);color:var(--wine)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--sunk)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.tw{overflow-x:auto;margin-top:10px}.tw table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:860px}.tw th{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.tw td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.list .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .s{font-size:12.5px;color:var(--muted);grid-column:1}
.list .it .r{grid-row:1/span 2;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{display:inline-flex;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.pill.new{background:var(--wine-soft);color:var(--wine)}.pill.ok{background:var(--good-soft);color:var(--good)}
.empty{padding:20px;text-align:center;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--muted)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--wine);font-weight:600}
@media(min-width:900px){nav.tabs{left:50%;right:auto;transform:translateX(-50%);width:640px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:13px;z-index:50}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.ag figure{margin:0;display:flex;flex-direction:column;gap:4px}.ag img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;background:var(--line)}.ag figcaption{font-size:11px;color:var(--muted)}
.src{word-break:break-all;font-size:12px}
.imgl{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:6px 0}.imgl a{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;aspect-ratio:3/4;padding:10px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);color:inherit;text-decoration:none}.imgl a span{font-size:11.5px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px}.consent{display:flex;gap:8px;align-items:flex-start;font-size:13px}.consent input{margin-top:3px}
.seg{flex-wrap:wrap}
.homebtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;font-size:15px;flex:none}
.pqbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.pqbox h3{margin:0;font-size:15px}
details.pqbox>summary{cursor:pointer;list-style:none;font-size:14px}
details.pqbox>summary::after{content:" · Chỉnh";color:var(--muted);font-size:12px}
.pqrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;border-top:1px solid var(--line);padding-top:10px}
.pqn{display:flex;flex-direction:column;min-width:0;flex:1 1 150px}.pqn small{color:var(--muted);font-size:12px}
.pqseg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.pqseg button{border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.pqseg button small{font-size:10.5px;color:var(--muted)}
.pqseg button+button{border-left:1px solid var(--line)}
.pqseg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.pqseg button[aria-pressed="true"] small{color:inherit;opacity:.75}
header .homebtn{text-decoration:none;color:var(--ink)}
</style>

<script>
(function(){
"use strict";
const CD=window.CherieData;
const db=CD.init({onChange:()=>{if(!busy())render()},onStatus:syncChip});
const TODAY=CD.today();
const view=document.getElementById("view");

/* ---------------- bộ lọc ---------------- */
function periodBar(){const [a,b]=range();const g=gran(a,b);
  return`<div class="period"><div class="chips" role="group" aria-label="Khoảng thời gian">${PRE.map(([k,n])=>`<button class="chip" type="button" data-pk="${k}" aria-pressed="${per.k===k}">${n}</button>`).join("")}</div>
  ${per.k==="c"?`<div class="custom"><label>Từ ngày<input type="date" id="pFrom" value="${a}" max="${TODAY}"></label><label>Đến ngày<input type="date" id="pTo" value="${b}" max="${TODAY}"></label></div>`:""}
  <div class="prow"><span class="note">${dm(a)}/${a.slice(0,4)} – ${dm(b)}/${b.slice(0,4)} · ${days(a,b)} ngày</span><span class="seg" role="group" aria-label="Gộp theo">${[["d","Ngày"],["w","Tuần"],["m","Tháng"]].map(([k,n])=>`<button type="button" data-g="${k}" aria-pressed="${g===k}">${n}</button>`).join("")}</span></div></div>`}
function bindPeriod(){view.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{per.k=b.dataset.pk;per.g="auto";if(per.k==="c"&&!per.from){const [a,c]=range();per.from=a;per.to=c}savePer();render()});
  view.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{per.g=b.dataset.g;const [a,c]=range();if(per.g==="d"&&days(a,c)>92){per.g="w";toast("Quá 92 ngày, tự gộp theo tuần cho dễ đọc")}savePer();render()});
  const f=view.querySelector("#pFrom"),t=view.querySelector("#pTo");if(f)f.onchange=()=>{per.from=f.value;savePer();f.blur();render()};if(t)t.onchange=()=>{per.to=t.value;savePer();t.blur();render()}}
function kpi(l,v,cur,prev,opt){opt=opt||{};let d="";if(prev!=null){if(!prev&&!cur)d=`<span class="d">Kỳ trước cũng 0</span>`;else if(!prev)d=`<span class="d">Kỳ trước chưa có</span>`;else if(opt.abs||prev<0||cur<0){const df=cur-prev;const up=opt.lowerBetter?df<0:df>=0;d=`<span class="d ${up?"up":"down"}"><b>${df>=0?"▲":"▼"} ${tr(Math.abs(df))}</b> so với kỳ trước</span>`}
    else{const ch=(cur-prev)/Math.abs(prev);if(ch>5)d=`<span class="d">Kỳ trước gần như chưa có số liệu</span>`;else{const up=opt.lowerBetter?ch<0:ch>=0;d=`<span class="d ${up?"up":"down"}"><b>${ch>=0?"▲":"▼"} ${pct(Math.abs(ch))}</b> so với kỳ trước</span>`}}}
  return`<div class="kpi ${opt.hero?"hero":""}"><span class="l">${l}</span><span class="v">${v}</span>${d}${opt.extra?`<span class="d">${opt.extra}</span>`:""}</div>`}

/* ---------------- màn hình ---------------- */
let tab="tq",nl="ln";
function render(){charts=[];document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));({tq:renderTQ,pl:renderPL,dt:renderDT,don:renderDon,kho:renderKho,cp:renderCP,nl:renderNL})[tab]()}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});

function series(a,b,g){const ks=buckets(a,b,g);const idx={};ks.forEach((k,i)=>idx[k]=i);const r=ks.map(()=>0),c=ks.map(()=>0),n=ks.map(()=>0);
  orders(a,b).forEach(d=>{const i=idx[bucketKey(ngayGN(d),g)];if(i!=null){r[i]+=rev(d).tong;n[i]++}});
  eachOpexDay(a,b,(d,v)=>{const i=idx[bucketKey(d,g)];if(i!=null)c[i]+=v});
  return{ks,r,c,n,e:r.map((v,i)=>v-c[i])}}

function hanhTrinh(s){const dk=duKien(),tt=tamTinh(),R=s.R;
  const step=(i,t,n,v,sub,on)=>`<div class="hs${on?" on":""}"><span class="hn">${i}</span><span class="hb"><b>${t}</b><span class="note">${n} đơn · ${sub}</span></span><b class="hv">${tr(v)}</b></div>`;
  const parts=[["Tiền thuê",R.thue],["Gói Yên tâm",R.yt],["Phí đến tận nơi",R.giao],["Phí trả trễ",R.tre],["Phí hư hỏng (khách đền)",R.hu]];
  return card("c0","Hành trình doanh thu","Đơn đi qua 3 bước. Chỉ bước 3 (khách đã trả đồ) mới tính là doanh thu.",`<div class="ht">
    ${step(1,"Đã đặt, chưa giao",dk.length,sumRev(dk).tong,"dự kiến",false)}
    ${step(2,"Đang thuê, chưa trả",tt.length,sumRev(tt).tong,"tạm tính, chốt khi trả đồ",false)}
    ${step(3,"Đã trả trong kỳ",s.n,s.dt,"doanh thu ghi nhận",true)}
    ${s.dt?`<div class="hd"><div class="note" style="font-weight:600;margin-bottom:4px">Doanh thu bước 3 gồm</div>${parts.filter(([,v])=>v).map(([n,v])=>`<div class="hr"><span>${n}</span><b>${tr(v)}</b><small>${pct(v/s.dt)}</small></div>`).join("")}${R.giam?`<div class="hr"><span class="note">Đã giảm theo khuyến mãi</span><b style="color:var(--muted)">−${tr(R.giam)}</b><small></small></div>`:""}</div>`:`<p class="note" style="margin:6px 0 0">Chưa có đơn nào trả đồ trong kỳ này, nên doanh thu ghi nhận bằng 0.</p>`}
  </div>`,"")}
function vanHanh(a,b){const os=orders(a,b),now=new Date();const D2=x=>new Date(x);
  const dung=os.filter(d=>!(d.traTT&&(D2(d.traTT)-D2(d.tra))>36e5)).length;
  const coAnh=os.filter(d=>{const ls=lines(d);return ls.length&&ls.every(c=>CD.ttDu&&CD.ttDu(d.id,"giao",c.sp)&&CD.ttDu(d.id,"nhan",c.sp))}).length;
  const tr=db.trips.filter(t=>t.loai!=="thu"&&t.ngay>=a&&t.ngay<=b&&t.d&&t.d.checkin&&!(db.don.find(d=>d.id===t.don)||{}).demo);
  const dg=tr.filter(t=>(D2(t.d.checkin)-D2(t.ngay+"T"+t.gio))<=15*6e4).length;
  const yt=os.filter(d=>d.yenTam).length;
  const live=db.don.filter(d=>!d.demo);
  const qh=live.filter(d=>d.tt==="Đang thuê"&&now>D2(d.tra));
  const ch=live.filter(d=>d.tt==="Đã trả"&&(d.ttCoc==="Chờ hoàn"||d.ttCoc==="Đang giữ"));const ch24=ch.filter(d=>d.traTT&&(now-D2(d.traTT))>36e5);
  const no=live.filter(d=>d.ttCoc==="Khách còn nợ"),noT=no.reduce((x,d)=>x+CD.quyetToan(d,lines(d)).conNo,0),mat=db.sp.filter(s=>s.tt==="Mất").length;const ck=db.sp.filter(s=>s.tt==="Chờ kiểm tra").length,lech=db.trips.filter(t=>String(t.tt).startsWith("Lệch")).length;
  const P=(x,n)=>n?Math.round(x/n*100)+"%":"–";const col=(x,n,ok)=>!n?"var(--muted)":x/n>=ok?"var(--pos)":"var(--neg)";
  const m=(l,v,sub,c)=>`<div class="kpi"><span class="l">${l}</span><span class="v" style="color:${c||"inherit"}">${v}</span><span class="d">${sub}</span></div>`;
  return card("cvh","Vận hành quầy và stylist","Tỷ lệ tính trên đơn đã trả trong kỳ. Hàng dưới là việc đang tồn ngay lúc này, mục tiêu là 0.",
   `<div class="kpis">${m("Trả đúng hẹn",P(dung,os.length),`${dung}/${os.length} đơn`,col(dung,os.length,.9))}${m("Đủ ảnh giao và nhận",P(coAnh,os.length),`${coAnh}/${os.length} đơn có đủ 4 ảnh mỗi món`,col(coAnh,os.length,.95))}${m("Stylist đến đúng giờ",P(dg,tr.length),`${dg}/${tr.length} chuyến, trễ dưới 15 phút`,col(dg,tr.length,.9))}${m("Mua Gói Yên tâm",P(yt,os.length),`${yt}/${os.length} đơn`)}</div>
   <div class="kpis" style="margin-top:10px">${m("Đơn quá hạn trả",qh.length,qh.length?"Quầy cần gọi khách":"Không có",qh.length?"var(--neg)":"var(--pos)")}${m("Cọc chờ hoàn",ch.length,ch24.length?`${ch24.length} đơn trả đồ hơn 1 giờ vẫn chưa hoàn`:`${tr0(ch)}`,ch24.length?"var(--neg)":"inherit")}${m("Khách còn nợ",no.length,no.length?noT.toLocaleString("vi-VN")+"đ phí vượt cọc, quầy cần thu":"Không có",no.length?"var(--neg)":"var(--pos)")}${m("Đầm báo mất",mat,mat?"Đã loại khỏi kho, cân nhắc nhập thay":"Không có",mat?"var(--neg)":"inherit")}${m("Món chờ kiểm",ck,ck?"Stylist mang về, quầy chưa kiểm":"Không có",ck?"var(--neg)":"var(--pos)")}${m("Chuyến thiếu món",lech,lech?"Cần đối soát":"Không có",lech?"var(--neg)":"var(--pos)")}</div>`,"")}
function tr0(ch){return ch.length?tr(ch.reduce((x,d)=>x+CD.quyetToan(d,lines(d)).hoan,0))+" cần hoàn":"Không có"}
function renderTQ(){const [a,b]=range(),g=gran(a,b),[pa,pb]=prevRange(a,b);const s=stats(a,b),p=stats(pa,pb);const S=series(a,b,g);
  const held=db.don.filter(d=>!d.demo&&(d.ttCoc==="Đang giữ"||d.ttCoc==="Chờ hoàn")).reduce((x,d)=>x+(+d.coc||0),0);
  const byLoai={};s.os.forEach(d=>lines(d).forEach(c=>{const sp=db.sp.find(x=>x.id===c.sp);const k=sp?sp.loai:"Khác";byLoai[k]=(byLoai[k]||0)+(+c.gia||0)*CD.luotDon(d)}));
  view.innerHTML=`<div><h1>Tổng quan</h1><p class="sub">Doanh thu chỉ ghi nhận khi khách trả đồ và chốt phí phát sinh. Đơn chưa trả hiện ở phần tạm tính. Chi phí lấy từ tab Chi phí.</p></div>${periodBar()}
  <div class="kpis">${kpi("Doanh thu ghi nhận",big(s.dt),s.dt,p.dt,{hero:true,extra:`${s.n} đơn đã trả · thuê ${tr(s.thue)} · phát sinh ${tr(s.ps)}`})}${kpi("Tạm tính (đang thuê)",big(sumRev(tamTinh()).tong),null,null,{extra:`${tamTinh().length} đơn chưa trả, có thể thêm phí trễ, hư hỏng`})}${kpi("Dự kiến (đã đặt)",big(sumRev(duKien()).tong),null,null,{extra:`${duKien().length} đơn chưa giao`})}${kpi("EBITDA",big(s.ebitda),s.ebitda,p.ebitda,{extra:`Biên ${pct(s.dt?s.ebitda/s.dt:NaN)}`})}${kpi("Số đơn",s.n,s.n,p.n,{extra:`${s.items} lượt món`})}${kpi("Giá trị đơn TB",big(s.aov),s.aov,p.aov)}${kpi("Cọc đang giữ",big(held),null,null,{extra:"Hiện tại, gồm đơn chờ hoàn"})}</div>
  ${vanHanh(a,b)}
  ${hanhTrinh(s)}
  <div class="grid2">
   ${card("c1",`Doanh thu và chi phí theo ${GN[g]}`,"Chi phí vận hành phân bổ đều theo ngày trong tháng, chưa gồm nhập hàng",`${legend([["var(--s1)","Doanh thu"],["var(--s2)","Chi phí vận hành"]])}<div class="chart" id="ch1"></div>`,tbl([GN[g][0].toUpperCase()+GN[g].slice(1),"Doanh thu","Chi phí","EBITDA","Số đơn"],S.ks.map((k,i)=>[bLong(k,g),money(S.r[i]),money(S.c[i]),money(S.e[i]),S.n[i]])))}
   ${card("c2",`EBITDA theo ${GN[g]}`,"Xanh là lãi, đỏ là lỗ",`<div class="chart" id="ch2"></div>`,"")}
   ${card("c3","Doanh thu thuê theo loại đồ","",`<div id="ch3"></div>`,tbl(["Loại đồ","Doanh thu"],Object.entries(byLoai).sort((x,y)=>y[1]-x[1]).map(([k,v])=>[k,money(v)])))}
   ${card("c4",`Số đơn theo ${GN[g]}`,"",`<div class="chart" id="ch4"></div>`,"")}
  </div>`;
  bindPeriod();bindTV();
  const L=S.ks.map(k=>bLabel(k,g)),LL=S.ks.map(k=>bLong(k,g));
  columns(document.getElementById("ch1"),{labels:L,long:LL,series:[{name:"Doanh thu",color:"var(--s1)",values:S.r},{name:"Chi phí vận hành",color:"var(--s2)",values:S.c}],fmt:money,aria:"Doanh thu và chi phí"});
  columns(document.getElementById("ch2"),{labels:L,long:LL,series:[{name:"EBITDA",colorFn:v=>v>=0?"var(--pos)":"var(--neg)",values:S.e}],fmt:v=>(v<0?"−":"")+money(Math.abs(v)),aria:"EBITDA",h:200});
  donut(document.getElementById("ch3"),{items:Object.entries(byLoai).map(([label,value])=>({label,value})),fmt:tr,center:"Tiền thuê",aria:"Doanh thu theo loại đồ"});
  columns(document.getElementById("ch4"),{labels:L,long:LL,series:[{name:"Số đơn",color:"var(--s1)",values:S.n}],fmt:v=>v+" đơn",axis:v=>String(Math.round(v)),aria:"Số đơn",h:180});
}

function renderPL(){const [a,b]=range(),g=gran(a,b),[pa,pb]=prevRange(a,b);const s=stats(a,b),p=stats(pa,pb);
  const byN=opexBy(a,b);
  const opexL=Object.entries(byN).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]);
  const srt=[...opexL].sort((x,y)=>y[1]-x[1]);const head=srt.slice(0,4),rest=srt.slice(4).reduce((x,y)=>x+y[1],0);
  const R=s.R;const steps=[{label:"Tiền thuê",value:R.thue},...[["Gói Yên tâm",R.yt],["Phí đến tận nơi",R.giao],["Phí trả trễ",R.tre],["Phí hư hỏng",R.hu]].filter(x=>x[1]>0).map(([label,value])=>({label,value})),...head.map(([n,v])=>({label:n,value:-v})),...(rest?[{label:"Chi phí khác",value:-rest}]:[]),{label:"EBITDA",value:s.ebitda,total:true}];
  const ln=(n,v,base,cls,col)=>`<div class="ln ${cls||""}"><span class="nm">${esc(n)}${cls?"":`<span class="mb"><i style="width:${base?Math.min(100,Math.abs(v)/base*100):0}%;background:${col}"></i></span>`}</span><b>${v<0?"−":""}${tr(Math.abs(v))}</b><small>${base?pct(v/base):"–"}</small></div>`;
  view.innerHTML=`<div><h1>Lãi lỗ (P&amp;L)</h1><p class="sub">Doanh thu ghi nhận khi khách trả đồ. EBITDA = doanh thu − chi phí vận hành. Chi phí tháng (mặt bằng, lương…) phân bổ đều theo ngày nên kỳ lẻ ngày vẫn đúng tỷ lệ. Tiền nhập hàng là đầu tư kho, tách riêng.</p></div>${periodBar()}
  <div class="kpis">${kpi("Doanh thu",big(s.dt),s.dt,p.dt,{hero:true})}${kpi("Chi phí vận hành",big(s.opex),s.opex,p.opex,{lowerBetter:true})}${kpi("EBITDA",big(s.ebitda),s.ebitda,p.ebitda)}${kpi("Biên EBITDA",pct(s.dt?s.ebitda/s.dt:NaN),null,null,{extra:`Kỳ trước ${pct(p.dt?p.ebitda/p.dt:NaN)}`})}${kpi("Đầu tư kho (nhập hàng)",big(s.capex),null,null,{extra:"Không tính vào EBITDA"})}</div>
  <div class="grid2">
   ${card("p1","Từ doanh thu đến EBITDA","Xanh cộng vào, đỏ trừ đi, cột cuối là EBITDA",`<div class="chart" id="pw"></div>`,tbl(["Khoản","Số tiền"],steps.map(x=>[x.label,(x.value<0?"−":"")+money(Math.abs(x.value))])))}
   ${card("p2","Cơ cấu chi phí vận hành","",`<div id="pd"></div>`,"")}
   ${card("p3","Báo cáo lãi lỗ",`${dm(a)}/${a.slice(0,4)} – ${dm(b)}/${b.slice(0,4)} · % trên doanh thu`,`<div class="pl">${ln("Tiền thuê",R.thue,s.dt,"","var(--pos)")}${ln("Gói Yên tâm",R.yt,s.dt,"","var(--pos)")}${ln("Phí đến tận nơi",R.giao,s.dt,"","var(--pos)")}${ln("Phí trả trễ",R.tre,s.dt,"","var(--pos)")}${ln("Phí hư hỏng",R.hu,s.dt,"","var(--pos)")}${ln("Tổng doanh thu ghi nhận",s.dt,s.dt,"tot")}${opexL.map(([n,v])=>ln(n,-v,s.dt,"","var(--neg)")).join("")}${ln("Tổng chi phí vận hành",-s.opex,s.dt,"tot")}${ln("EBITDA",s.ebitda,s.dt,"tot")}</div>`,"")}
   ${card("p4","Biên EBITDA theo tháng","Phần trăm doanh thu còn lại sau chi phí vận hành",`<div class="chart" id="pm"></div>`,"")}
  </div>`;
  bindPeriod();bindTV();
  waterfall(document.getElementById("pw"),steps);
  donut(document.getElementById("pd"),{items:opexL.map(([label,value])=>({label,value})),fmt:tr,center:"Chi phí",aria:"Cơ cấu chi phí"});
  const S=series(a,b,"m");const g2="m";columns(document.getElementById("pm"),{labels:S.ks.map(k=>bLabel(k,g2)),long:S.ks.map(k=>bLong(k,g2)),series:[{name:"Biên EBITDA",colorFn:v=>v>=0?"var(--pos)":"var(--neg)",values:S.r.map((r,i)=>r?S.e[i]/r*100:0)}],fmt:v=>pct(v/100),axis:v=>Math.round(v)+"%",aria:"Biên EBITDA",h:190});
}

function renderDT(){const [a,b]=range();const os=orders(a,b);
  const by=(f)=>{const m={};os.forEach(d=>{const k=f(d);m[k]=(m[k]||0)+rev(d).tong});return Object.entries(m).map(([label,value])=>({label,value}))};
  const dip=by(d=>d.dip||"Khác");const src=by(d=>{const k=db.kh.find(x=>x.id===d.dat);return k?k.nguon||"Khác":"Khác"});
  const city=by(d=>{const k=db.kh.find(x=>x.id===d.dat);return k&&k.tp==="Đà Nẵng"?"Khách ở Đà Nẵng":"Khách du lịch"});
  const sp={};os.forEach(d=>lines(d).forEach(c=>{sp[c.sp]=(sp[c.sp]||0)+(+c.gia||0)}));
  const top=Object.entries(sp).map(([id,v])=>{const s=db.sp.find(x=>x.id===id);return{label:s?s.ten:id,value:v}}).sort((x,y)=>y.value-x.value).slice(0,8);
  const WD=["T2","T3","T4","T5","T6","T7","CN"];const wd=[0,0,0,0,0,0,0];os.forEach(d=>{const i=(D(d.nhan.slice(0,10)).getDay()+6)%7;wd[i]+=rev(d).tong});
  view.innerHTML=`<div><h1>Doanh thu</h1><p class="sub">Doanh thu đã ghi nhận (đơn đã trả đồ) đến từ đâu: dịp, nguồn khách, mẫu đầm, ngày trong tuần.</p></div>${periodBar()}
  <div class="grid2">
   ${card("d1","Theo dịp","",`<div id="dd1"></div>`,tbl(["Dịp","Doanh thu"],dip.sort((x,y)=>y.value-x.value).map(x=>[x.label,money(x.value)])))}
   ${card("d2","Theo nguồn khách","Kênh khách tìm đến Chérie",`<div id="dd2"></div>`,tbl(["Nguồn","Doanh thu"],src.sort((x,y)=>y.value-x.value).map(x=>[x.label,money(x.value)])))}
   ${card("d3","8 mẫu mang về nhiều tiền thuê nhất","",`<div id="dd3"></div>`,"")}
   ${card("d4","Theo ngày nhận đồ trong tuần","Cuối tuần là lúc cần đủ người và đủ đồ",`<div class="chart" id="dd4"></div>`,"")}
   ${card("d5","Khách địa phương và khách du lịch","",`<div id="dd5"></div>`,"")}
  </div>`;
  bindPeriod();bindTV();
  donut(document.getElementById("dd1"),{items:dip,fmt:tr,center:"Doanh thu",aria:"Doanh thu theo dịp"});
  donut(document.getElementById("dd2"),{items:src,fmt:tr,center:"Doanh thu",aria:"Doanh thu theo nguồn"});
  hbars(document.getElementById("dd3"),{items:top,fmt:tr,aria:"Top mẫu theo doanh thu"});
  columns(document.getElementById("dd4"),{labels:WD,series:[{name:"Doanh thu",color:"var(--s1)",values:wd}],fmt:money,aria:"Doanh thu theo thứ",h:190});
  donut(document.getElementById("dd5"),{items:city,fmt:tr,center:"Doanh thu",aria:"Khách địa phương và du lịch"});
}

function renderKho(){const [a,b]=range();
  const occ={};donNhan(a,b).forEach(d=>lines(d).forEach(c=>{const sp=db.sp.find(x=>x.id===c.sp);const dd=days(d.nhan,d.tra)+(sp?+sp.giat||0:0);occ[c.sp]=(occ[c.sp]||0)+dd}));
  const done=new Set(db.don.filter(d=>d.tt!=="Hủy").map(d=>d.id));

/* Nhân sự: mỗi người đăng nhập app bằng tên + mã PIN do chủ tiệm đặt. Không cần email. */
function nlNS(el){const ns=[...(db.nv||[])].sort((x,y)=>(!!x.nghi)-(!!y.nghi));const G=window.GASDB;const me=G&&G.me&&G.me()||{};let pinOf={};

   ${G?`<label class="f">Mã PIN đăng nhập (4–8 số)<input type="text" id="nPin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="Ví dụ: 2580"></label>`:""}

   <p class="note">Nhân viên mở link trang nhân sự (?p=home), chọn tên mình và nhập mã PIN này. Không cần email hay tài khoản Google. Nghỉ việc thì bấm "Đánh dấu nghỉ", mã PIN mất hiệu lực ngay.</p></form></section>
   <section class="card"><h2>Đội ngũ · ${ns.filter(n=>!n.nghi).length}</h2><div class="list">${ns.map(n=>{const self=n.id===me.id;return `<div class="it"><span class="t">${esc(n.ten)}${self?" · bạn":""}${n.nghi?" · đã nghỉ":""}</span><span class="s">${esc(n.vaiTro)} <span data-pst="${n.id}"></span></span><span class="r">${G&&!n.nghi?`<button class="btn sm" type="button" data-pin="${n.id}">Đặt PIN</button>`:""}${self?"":`<button class="btn sm" type="button" data-ns="${n.id}">${n.nghi?"Cho làm lại":"Đánh dấu nghỉ"}</button>`}</span></div><div data-pbox="${n.id}" style="display:none;gap:8px;padding:0 0 10px"><input type="text" inputmode="numeric" maxlength="8" placeholder="PIN mới 4–8 số" style="flex:1;min-width:0"><button class="btn sm primary" type="button">Lưu</button></div>`}).join("")||'<p class="empty">Chưa có ai.</p>'}</div></section></div>`;
  const f=el.querySelector("#fns");
  f.onsubmit=e=>{e.preventDefault();const t=f.querySelector("#nTen").value.trim(),vt=f.querySelector("#nVt").value,err=f.querySelector("#nErr");const fail=m=>{err.textContent=m;err.hidden=false};
    if(!t)return fail("Nhập tên gọi.");
    if(ns.some(n=>n.ten.toLowerCase()===t.toLowerCase()&&!n.nghi))return fail("Tên này đã có. Thêm họ hoặc chữ cái để phân biệt.");
    if(!G){db.nv.push({id:CD.newId("NV"),ten:t,vaiTro:vt,tao:TODAY});CD.save();nlNS(el);toast("Đã thêm "+t);return}
    const pin=f.querySelector("#nPin").value.trim();if(!/^\d{4,8}$/.test(pin))return fail("Mã PIN gồm 4–8 số.");
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Đang thêm…";
    G.call("themNv",{ten:t,vaiTro:vt,pin}).then(r=>{if(!db.nv.some(x=>x.id===r.nv.id))db.nv.push(r.nv);nlNS(el);toast(`Đã thêm ${t}. Báo PIN cho ${t} qua Zalo hoặc nói trực tiếp.`)},x=>{btn.disabled=false;btn.textContent="Thêm";fail(x.message||"Không thêm được, thử lại.")})};
  el.querySelectorAll("[data-ns]").forEach(b=>b.onclick=()=>{const n=db.nv.find(x=>x.id===b.dataset.ns);n.nghi=!n.nghi;CD.save();if(G&&n.nghi)G.call("setPin",{nv:n.id,xoa:true}).catch(()=>{});nlNS(el);toast(n.nghi?`${n.ten} đã nghỉ, không đăng nhập được nữa`:`Đặt lại PIN để ${n.ten} đăng nhập`)});
  el.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>{const box=el.querySelector(`[data-pbox="${b.dataset.pin}"]`);const op=box.style.display!=="flex";box.style.display=op?"flex":"none";if(op)box.querySelector("input").focus()});

  function showPin(){el.querySelectorAll("[data-pst]").forEach(sp=>{const id=sp.dataset.pst;if(id in pinOf)sp.innerHTML=pinOf[id]?'· <b style="color:var(--ok,#2e7d4f)">đã có PIN</b>':'· <b style="color:var(--bad,#b3261e)">chưa có PIN</b>';const pb=el.querySelector(`[data-pin="${id}"]`);if(pb&&id in pinOf)pb.textContent=pinOf[id]?"Đổi PIN":"Đặt PIN"})}
  if(G)G.call("pinStatus").then(r=>{(r.staff||[]).forEach(x=>pinOf[x.id]=!!x.pin);showPin()}).catch(()=>{});

function nlLoi(el){const L=[...(db.loi||[])].sort((a,b)=>(a.tt==="Đã sửa"||a.tt==="Bỏ qua")-(b.tt==="Đã sửa"||b.tt==="Bỏ qua")||(a.cuoi<b.cuoi?1:-1));
  const TR={quay:"Quầy",stylist:"Stylist",marketing:"Marketing",admin:"Admin",web:"Website",home:"Trang nhân sự"};
  el.innerHTML=`<section class="card"><h2>Lỗi hệ thống · ${L.filter(x=>x.tt!=="Đã sửa"&&x.tt!=="Bỏ qua").length} chưa xử lý</h2><p class="note">Mỗi khi nhân viên hoặc khách gặp lỗi (ảnh không hiện, nút bấm lỗi, tải chậm, lưu không được), app tự ghi lại ở đây, gộp các lần giống nhau. Agent kiểm tra định kỳ và gửi email tóm tắt cho chủ tiệm. Không ghi thông tin khách.</p>
   <div class="list">${L.map(x=>`<div class="it"><span class="t">${esc(x.loai)} · ${esc(TR[x.trang]||x.trang||"")} <span class="pill ${x.tt==="Đã sửa"?"ok":x.tt==="Bỏ qua"?"":"new"}">${esc(x.tt||"Mới")}</span></span><span class="s">${esc(x.ct)}<br>${x.n||1} lần · gần nhất ${esc(String(x.cuoi||"").replace("T"," "))} · ${esc(x.ai||"")}</span><span class="r">${x.tt==="Đã sửa"||x.tt==="Bỏ qua"?"":`<button class="btn sm" type="button" data-loi="${x.id}" data-to="Đã sửa">Đã sửa</button><button class="btn sm" type="button" data-loi="${x.id}" data-to="Bỏ qua">Bỏ qua</button>`}</span></div>`).join("")||'<p class="empty">Chưa ghi nhận lỗi nào.</p>'}</div></section>`;
  el.querySelectorAll("[data-loi]").forEach(b=>b.onclick=()=>{const x=db.loi.find(y=>y.id===b.dataset.loi);x.tt=b.dataset.to;CD.save();renderNL()});
}
/* Khuyến mãi: chủ tiệm tạo chương trình, Quầy, stylist và CS online chỉ chọn được chương trình đang chạy cho kênh của mình */
let kmSua=null;
function nlKM(el){const CDk=CD,ds=[...(db.km||[])].sort((a,b)=>(a.tu||"")<(b.tu||"")?1:-1);const T=TODAY;
  const dung=id=>db.don.filter(d=>!d.demo&&d.km===id&&d.tt!=="Hủy");
  const cur=kmSua?(db.km||[]).find(x=>x.id===kmSua)||{}:{};const v=(k,d)=>esc(cur[k]!=null?cur[k]:d);
  const pill=m=>{const t=CDk.kmTrangThai(m,T);return `<span class="pill ${t==="Đang chạy"?"ok":t==="Sắp chạy"?"new":""}">${t}</span>`};
  el.innerHTML=`<div class="grid2"><section class="card"><h2>${kmSua?"Sửa chương trình":"Tạo chương trình giảm giá"}</h2><form class="form" id="fkm" novalidate>
   <label class="f">Tên chương trình<input type="text" id="kTen" value="${v("ten","")}" placeholder="Ví dụ: Khai trương giảm 20%"></label>
   <div class="two"><label class="f">Kiểu giảm<select id="kLoai"><option value="pt" ${cur.loai!=="tien"?"selected":""}>Giảm % tiền thuê</option><option value="tien" ${cur.loai==="tien"?"selected":""}>Giảm số tiền cố định</option></select></label><label class="f"><span id="kGtL">Mức giảm (%)</span><input type="number" id="kGt" min="0" value="${v("giaTri","")}"></label></div>
   <div class="two"><label class="f" id="kTdW">Giảm tối đa (đ, để trống nếu không giới hạn)<input type="number" id="kTd" min="0" step="10000" value="${v("toiDa","")}"></label><label class="f">Tiền thuê tối thiểu của đơn (đ)<input type="number" id="kTt" min="0" step="10000" value="${v("toiThieu","")}"></label></div>
   <div class="two"><label class="f">Từ ngày<input type="date" id="kTu" value="${v("tu",T)}"></label><label class="f">Đến hết ngày<input type="date" id="kDen" value="${v("den","")}"></label></div>
   <fieldset class="f" style="border:0;padding:0;margin:0"><span>Áp dụng cho</span>${CDk.KM_KENH.map(([k,n])=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" data-kk="${k}" style="width:auto" ${!cur.kenh||cur.kenh.includes(k)?"checked":""}> ${k} · ${n}</label>`).join("")}</fieldset>
   <label class="f">Điều kiện, ghi chú cho nhân viên<input type="text" id="kDk" value="${v("dk","")}" placeholder="Ví dụ: áp dụng khách mới, không cộng dồn"></label>
   <p class="err" id="kErr" hidden></p><div class="btns"><button class="btn primary" type="submit">${kmSua?"Lưu thay đổi":"Tạo chương trình"}</button>${kmSua?'<button class="btn" type="button" id="kHuy">Huỷ sửa</button>':""}</div>
   <p class="note">Chỉ giảm trên tiền thuê, không trừ cọc, phí đến tận nơi và Gói Yên tâm. Nhân viên chỉ thấy chương trình đang chạy cho kênh của mình; đơn đã tạo giữ nguyên mức giảm dù chương trình hết hạn.</p></form></section>
   <section class="card"><h2>Các chương trình · ${ds.length}</h2><div class="list">${ds.map(m=>{const u=dung(m.id),g=u.reduce((a,d)=>a+(+d.giam||0),0);return `<div class="it"><span class="t">${esc(m.ten)} ${pill(m)}</span><span class="s">${esc(CDk.kmMoTa(m))} · ${m.tu?esc(m.tu.slice(8,10)+"/"+m.tu.slice(5,7)):"…"} → ${m.den?esc(m.den.slice(8,10)+"/"+m.den.slice(5,7)):"không hạn"} · ${(m.kenh||[]).join(", ")||"mọi kênh"}<br>${u.length} đơn đã dùng · đã giảm ${money(g)}${m.dk?" · "+esc(m.dk):""}</span><span class="r"><button class="btn sm" type="button" data-kms="${m.id}">Sửa</button><button class="btn sm" type="button" data-kmt="${m.id}">${m.tt==="Tắt"?"Bật lại":"Tắt"}</button></span></div>`}).join("")||'<p class="empty">Chưa có chương trình nào.</p>'}</div></section></div>`;
  const $=q=>el.querySelector(q);const loai=()=>{const pt=$("#kLoai").value==="pt";$("#kGtL").textContent=pt?"Mức giảm (%)":"Số tiền giảm (đ)";$("#kTdW").hidden=!pt};loai();$("#kLoai").onchange=loai;
  if($("#kHuy"))$("#kHuy").onclick=()=>{kmSua=null;nlKM(el)};
  $("#fkm").onsubmit=e=>{e.preventDefault();const fail=m=>{$("#kErr").textContent=m;$("#kErr").hidden=false};
    const ten=$("#kTen").value.trim(),lo=$("#kLoai").value,gt=+$("#kGt").value,tu=$("#kTu").value,den=$("#kDen").value,kenh=[...el.querySelectorAll("[data-kk]")].filter(x=>x.checked).map(x=>x.dataset.kk);
    if(!ten)return fail("Nhập tên chương trình.");if(!(gt>0))return fail("Nhập mức giảm.");if(lo==="pt"&&gt>100)return fail("Giảm % tối đa 100.");
    if(!tu)return fail("Chọn ngày bắt đầu.");if(den&&den<tu)return fail("Ngày kết thúc phải sau ngày bắt đầu.");if(!kenh.length)return fail("Chọn ít nhất một kênh.");
    db.km=db.km||[];let m=kmSua&&db.km.find(x=>x.id===kmSua);if(!m){m={id:CD.newId("KM"),tao:TODAY,tt:"Bật"};db.km.push(m)}
    Object.assign(m,{ten,loai:lo,giaTri:gt,toiDa:lo==="pt"?(+$("#kTd").value||0):0,toiThieu:+$("#kTt").value||0,tu,den,kenh,dk:$("#kDk").value.trim()});
    CD.save();kmSua=null;nlKM(el);toast(`Đã lưu "${ten}". Quầy, stylist, CS online thấy ngay khi chương trình đang chạy.`)};
  el.querySelectorAll("[data-kms]").forEach(b=>b.onclick=()=>{kmSua=b.dataset.kms;nlKM(el);el.scrollIntoView({behavior:"smooth"})});
  el.querySelectorAll("[data-kmt]").forEach(b=>b.onclick=()=>{const m=db.km.find(x=>x.id===b.dataset.kmt);m.tt=m.tt==="Tắt"?"Bật":"Tắt";CD.save();nlKM(el);toast(m.tt==="Tắt"?`Đã tắt "${m.ten}"`:`Đã bật lại "${m.ten}"`)});
}
/* Phân quyền: mỗi vai trò có mức Không / Xem / Sửa cho từng app; có thể đặt riêng cho từng người. Máy chủ kiểm tra lại mọi lần mở trang và lưu. */
const Q_COT=[["quay","App Quầy","Bán tại tiệm, đơn, nhận trả, hoàn cọc"],["stylist","App Stylist","Chuyến giao, nhận, thử đồ"],["marketing","App Marketing","Khách online, nội dung, blog"],["admin","Admin","Báo cáo, P&L, kho, chi phí"],["rieng","Hồ sơ riêng","Hợp đồng, CCCD, ảnh tình trạng"]];
const Q_MUCS=[["khong","Không"],["xem","Xem"],["sua","Sửa"]];
const Q_MD={"Quầy":{quay:"sua",stylist:"khong",marketing:"khong",admin:"khong",rieng:"sua"},"Stylist":{quay:"khong",stylist:"sua",marketing:"khong",admin:"khong",rieng:"sua"},"Marketing":{quay:"khong",stylist:"khong",marketing:"sua",admin:"khong",rieng:"khong"}};
function qCfg(){db.cauhinh=db.cauhinh||[];let c=db.cauhinh.find(x=>x.id==="quyen");if(!c){c={id:"quyen",vaiTro:{}};db.cauhinh.push(c)}c.vaiTro=c.vaiTro||{};return c}
function qVaiTro(vt){if(vt==="Admin")return{quay:"sua",stylist:"sua",marketing:"sua",admin:"sua",rieng:"sua"};const c=qCfg().vaiTro[vt]||{},m=Q_MD[vt]||Q_MD.Stylist,o={};Q_COT.forEach(([k])=>o[k]=c[k]||m[k]);return o}
function nlPQ(el){const roles=["Quầy","Stylist","Marketing"];const ns=(db.nv||[]).filter(n=>!n.nghi&&n.vaiTro!=="Admin");
  const seg=(attr,cur,dflt)=>`<div class="pqseg" role="group">${dflt?`<button type="button" ${attr} data-v="" aria-pressed="${!cur}">Theo vai trò<small>${Q_MUCS.find(x=>x[0]===dflt)[1]}</small></button>`:""}${Q_MUCS.map(([v,n])=>`<button type="button" ${attr} data-v="${v}" aria-pressed="${cur===v}" class="m-${v}">${n}</button>`).join("")}</div>`;
  const rows=(attr,get,dflt)=>Q_COT.map(([k,n,d])=>`<div class="pqrow"><span class="pqn"><b>${n}</b><small>${d}</small></span>${seg(`${attr} data-k="${k}"`,get(k),dflt&&dflt[k])}</div>`).join("");
  el.innerHTML=`<section class="card"><h2>Quyền theo vai trò</h2><p class="note">Không: app không hiện và không mở được. Xem: mở được nhưng không lưu thay đổi. Sửa: dùng đầy đủ. Chủ tiệm luôn có toàn quyền. Nhân viên tải lại trang là áp dụng.</p>
   ${roles.map(r=>{const q=qVaiTro(r);return `<div class="pqbox"><h3>${r}</h3>${rows(`data-vt="${r}"`,k=>q[k])}</div>`}).join("")}
   <div class="btns"><button class="btn" type="button" id="pqMd">Về mặc định</button></div></section>
  <section class="card"><h2>Quyền riêng từng người</h2><p class="note">Mặc định mỗi người theo quyền vai trò. Chỉ đặt riêng khi một người cần khác đồng nghiệp, ví dụ một bạn quầy kiêm đi giao.</p>
   ${ns.length?ns.map(n=>{const own=n.quyen||{},q=qVaiTro(n.vaiTro),nr=Object.keys(own).length;return `<details class="pqbox"><summary><b>${esc(n.ten)}</b> · ${esc(n.vaiTro)}${nr?` <span class="pill new">${nr} quyền riêng</span>`:""}</summary>${rows(`data-nv="${n.id}"`,k=>own[k]||"",q)}</details>`}).join(""):'<p class="empty">Chưa có nhân sự nào ngoài chủ tiệm.</p>'}</section>`;
  el.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>{const c=qCfg();c.vaiTro[b.dataset.vt]=Object.assign({},qVaiTro(b.dataset.vt),{[b.dataset.k]:b.dataset.v});CD.save();nlPQ(el);toast(`Đã lưu quyền ${b.dataset.vt}`)});
  el.querySelectorAll("[data-nv]").forEach(b=>b.onclick=()=>{const n=db.nv.find(x=>x.id===b.dataset.nv);const q=Object.assign({},n.quyen||{});if(b.dataset.v)q[b.dataset.k]=b.dataset.v;else delete q[b.dataset.k];n.quyen=q;CD.save();nlPQ(el);const d=el.querySelector(`details [data-nv="${n.id}"]`);if(d)d.closest("details").open=true;toast(`Đã lưu quyền riêng của ${n.ten}`)});
  el.querySelector("#pqMd").onclick=()=>{const c=qCfg();c.vaiTro={};CD.save();nlPQ(el);toast("Đã đưa quyền các vai trò về mặc định")};
}
/* Đánh giá: chỉ đăng lên website khi admin duyệt. Không tự viết đánh giá thay khách. */
function nlDG(el){const rs=[...(db.review||[])].sort((x,y)=>x.tg<y.tg?1:-1);
  el.innerHTML=`<div class="grid2"><section class="card"><h2>Đánh giá của khách</h2><p class="note">Khách gửi từ website bằng mã lịch hẹn hoặc số Zalo đã thuê. Chỉ đánh giá đã duyệt mới hiện trên website. Không sửa lời khách; chỉ ẩn khi có thông tin cá nhân hoặc lời lẽ không phù hợp.</p>
   <div class="list">${rs.map(r=>`<div class="it"><span class="t">${"★".repeat(r.sao)}${"☆".repeat(5-r.sao)} · ${esc(r.ten)}</span><span class="s">${esc(r.noiDung)}${r.ma?" · mã "+esc(r.ma):""}${r.xacThuc?" · đã khớp đơn":" · chưa khớp đơn"}</span><span class="r"><span class="pill ${r.tt==="Đã duyệt"?"ok":r.tt==="Chờ duyệt"?"new":""}">${esc(r.tt)}</span>${r.tt!=="Đã duyệt"?`<button class="btn sm" type="button" data-dg="${r.id}" data-to="Đã duyệt">Duyệt</button>`:""}${r.tt!=="Ẩn"?`<button class="btn sm" type="button" data-dg="${r.id}" data-to="Ẩn">Ẩn</button>`:""}</span></div>`).join("")||'<p class="empty">Chưa có đánh giá. Sau khi khách trả đồ, tin cảm ơn kèm link đánh giá sẽ gửi từ app Quầy.</p>'}</div></section>
   <section class="card"><h2>Nhập đánh giá khách gửi qua Zalo</h2><form class="form" id="fdg" novalidate><p class="note">Chỉ nhập đúng lời khách đã gửi, có ảnh chụp tin nhắn làm bằng chứng.</p>
   <label class="f">Mã đơn<input type="text" id="gMa" placeholder="D011"></label><label class="f">Tên hiển thị<input type="text" id="gTen" placeholder="Linh, Đà Nẵng"></label>
   <label class="f">Số sao<select id="gSao">${[5,4,3,2,1].map(x=>`<option>${x}</option>`).join("")}</select></label><label class="f">Lời khách<textarea id="gNd" rows="3"></textarea></label>
   <p class="err" id="gErr" hidden></p><button class="btn primary" type="submit">Lưu và duyệt</button></form></section></div>`;
  el.querySelectorAll("[data-dg]").forEach(b=>b.onclick=()=>{const r=db.review.find(x=>x.id===b.dataset.dg);if(r){r.tt=b.dataset.to;CD.save();renderNL()}});
  const f=el.querySelector("#fdg");f.onsubmit=e=>{e.preventDefault();const v=i=>f.querySelector("#"+i).value.trim();const err=f.querySelector("#gErr");
    const d=db.don.find(x=>x.id.toUpperCase()===v("gMa").toUpperCase());
    if(!d){err.textContent="Mã đơn không có trong hệ thống. Chỉ nhập đánh giá của khách đã thuê thật.";err.hidden=false;return}
    if(!v("gTen")||!v("gNd")){err.textContent="Nhập tên hiển thị và lời khách.";err.hidden=false;return}
    db.review.push({id:CD.newId("DG"),tg:new Date().toISOString().slice(0,16),ma:d.id,ten:v("gTen"),sao:+v("gSao"),noiDung:v("gNd"),sp:lines(d).map(c=>c.sp),xacThuc:true,nguon:"Zalo",tt:"Đã duyệt"});CD.save();renderNL();toast("Đã lưu đánh giá")};
}
function nlYC(el){const ys=[...db.yc].sort((x,y)=>x.tg<y.tg?1:-1);
  el.innerHTML=`<section class="card"><h2>Yêu cầu từ website</h2><p class="note">Khách gửi lịch thử hoặc giữ đồ trên website. Gọi Zalo xác nhận rồi đánh dấu ở đây; quầy cũng thấy danh sách này.</p>
  <div class="list">${ys.map(y=>`<div class="it"><span class="t">${esc(y.ten)} · ${esc(y.loai)}</span><span class="s">${esc(y.sdt)} · ${dm(y.nhan)} ${y.nhan.slice(11)} · ${esc(y.cach)}${y.noi?" · "+esc(y.noi):""}${(y.sp||[]).length?" · "+y.sp.map(id=>{const s=db.sp.find(x=>x.id===id);return s?s.ten:id}).join(", "):""}${y.note?" · "+esc(y.note):""}</span>
   <span class="r"><span class="pill ${y.tt==="Mới"?"new":y.tt==="Đã chốt"?"ok":""}">${esc(y.tt)}</span>${y.tt==="Mới"?`<button class="btn sm" type="button" data-yc="${y.id}" data-to="Đã liên hệ">Đã liên hệ</button>`:y.tt==="Đã liên hệ"?`<button class="btn sm" type="button" data-yc="${y.id}" data-to="Đã chốt">Đã chốt</button>`:""}</span></div>`).join("")||'<p class="empty">Chưa có yêu cầu nào. Thử gửi một lịch hẹn trên trang Website.</p>'}</div></section>`;
  el.querySelectorAll("[data-yc]").forEach(b=>b.onclick=()=>{const y=db.yc.find(x=>x.id===b.dataset.yc);if(y){y.tt=b.dataset.to;CD.save();renderNL()}});
}

render();
try{window.__a={rev,lines};}catch(e){}
})();

</script>
</body></html>
