<style>
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.hd .who{display:flex;align-items:center;gap:6px}
.icb{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;color:var(--ink)}
.icb svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icb.spinning svg{animation:sp .8s linear infinite}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font:500 26px/1.2 var(--font-display);margin:4px 0 16px}
h2{font:600 16px/1.3 var(--font-body);margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{font-weight:400;color:var(--muted);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;padding:8px 2px 6px;border:0;background:none;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--care);font-weight:600}
.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wine);color:#fff;font-size:11px;line-height:18px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px;text-align:left;cursor:pointer}
.stat b{display:block;font:500 26px/1.1 var(--font-mono);color:var(--care)}
.stat span{font-size:13px;color:var(--muted)}
.stat.hot b{color:var(--err)}
.list{display:grid;gap:10px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px;display:flex;flex-direction:column;gap:8px}
button.it{text-align:left;cursor:pointer;width:100%}
.it .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.it .ma{font:500 14px var(--font-mono);color:var(--care)}
.it .t{font-weight:600}
.it .s{font-size:13.5px;color:var(--muted)}
.it .acts{display:flex;flex-wrap:wrap;gap:8px}
.late{color:var(--err);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-card);font-size:14.5px}
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg .chip{flex:none}
.seg .chip b{margin-left:6px;font-family:var(--font-mono);font-weight:500}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;min-height:48px;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:16px}
.search svg{position:absolute;left:14px;top:14px;width:20px;height:20px;stroke:var(--muted);stroke-width:1.6;fill:none}
.form{display:flex;flex-direction:column;gap:14px}
.mon{border:1px solid var(--line);border-radius:var(--radius-card);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.mon .mh{display:flex;justify-content:space-between;align-items:center}
.mon .mh b{font:500 14px var(--font-mono);color:var(--care)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:3/4;border:1px dashed var(--care-mid);border-radius:12px;background:var(--care-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--care);text-align:center;overflow:hidden;cursor:pointer;padding:4px}
.ph svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.4;fill:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .st{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(27,22,24,.7);color:#fff;border-radius:6px;font-size:10.5px;padding:2px}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs a{width:56px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--care-soft)}
.thumbs img{width:100%;height:100%;object-fit:cover;color:transparent;font-size:0}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.sum .mono{text-align:right}
.sum .big{font-weight:600;font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(27,22,24,.42);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.sheet-bg.show{opacity:1}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .2s}
.sheet-bg.show .sheet{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--bg);padding:6px 0 10px;z-index:2}
.sheet .sh h3{margin:0;font:500 22px/1.2 var(--font-display)}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.bar .btn{flex:1 1 140px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .bx{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.gate h1{margin:8px 0 0}
.bars{display:grid;gap:10px}
.bars .b{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bars .tr{height:10px;border-radius:5px;background:var(--care-soft);overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--care)}
.goal{font-size:13px;color:var(--muted);margin-top:6px}
#printArea{display:none}
@media print{
  body{padding:0;background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .tem{page-break-inside:avoid;break-inside:avoid}
}
#printArea .tems{display:flex;flex-wrap:wrap;gap:6mm}
.tem{width:50mm;height:90mm;border:1px solid #E4DDDA;border-radius:4mm;padding:4mm 3.5mm;display:flex;flex-direction:column;align-items:center;gap:2mm;font-family:var(--font-body);color:#1B1618;background:#fff;position:relative}
.tem .hole{width:5mm;height:5mm;border-radius:50%;border:1px solid #8C6B3A}
.tem .code{font:500 15pt/1 var(--font-mono);color:#24476B;letter-spacing:.02em}
.tem .nm{font-size:9pt;text-align:center;line-height:1.3}
.tem .hen{width:100%;background:#E4ECF4;border-radius:2mm;padding:1.5mm;text-align:center;font-size:8pt}
.tem .qr{width:24mm;height:24mm}
.tem .qr svg{width:100%;height:100%}
.tem .ft{font:400 7pt var(--font-mono);color:#6C6266;text-align:center;margin-top:auto}
.prbar{display:flex;gap:10px;padding:12px;justify-content:center}
@media print{.prbar{display:none}}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>

      else go()}});
    var nb=$("[data-note]",c);if(nb)nb.onclick=function(){var m=D.mon.filter(function(x){return x.MaMon===ma})[0];hoi("Ghi chú · "+ma,'<label class="f"><span>Ghi chú xưởng</span><textarea name="GhiChuXuong">'+E(m.GhiChuXuong)+'</textarea></label>').then(function(o){if(!o)return;C.call("capNhatMon",{ma:ma,obj:o}).then(function(r){upsert(D.mon,"MaMon",r.mon);ve()},loi)})}})}

/* ---------- TỔNG QUAN (chủ tiệm) ---------- */
var thang="";
function veTong(v){if(!thang)thang=C.homNay().slice(0,7);
  var ps=D.phieu.filter(function(p){return String(p.NgayNhan).slice(0,7)===thang&&p.TrangThai!=="Hủy"});
  var ma={};ps.forEach(function(p){ma[p.MaPhieu]=p});var ms=D.mon.filter(function(m){return ma[m.MaPhieu]});
  var dt=ps.reduce(function(s,p){return s+C.num(p.PhaiThu)},0),thu=ps.reduce(function(s,p){return s+C.num(p.DaThu)},0);
  var ngoai=ps.filter(function(p){return p.LoaiKhach==="Khách ngoài"||p.LoaiKhach==="Doanh nghiệp"}).reduce(function(s,p){return s+C.num(p.PhaiThu)},0);
  var tl=dt?Math.round(ngoai*100/dt):0;
  var daTra=ps.filter(function(p){return p.TrangThai==="Đã trả"&&p.NgayTra}),dung=daTra.filter(function(p){return!p.HenTra||p.NgayTra<=p.HenTra}).length;
  var suco=ms.filter(function(m){return m.SuCo}).length,denBu=ms.reduce(function(s,m){return s+C.num(m.DenBu)},0),xuong=ms.reduce(function(s,m){return s+C.num(m.GiaXuong)},0);
  var nhom={};ms.forEach(function(m){var k=String(m.DichVu).split(" · ")[0]||"Khác";nhom[k]=(nhom[k]||0)+C.num(m.Gia)});var mx=Math.max.apply(null,Object.keys(nhom).map(function(k){return nhom[k]}).concat([1]));
  var lk={};ps.forEach(function(p){lk[p.LoaiKhach]=(lk[p.LoaiKhach]||0)+C.num(p.PhaiThu)});var mx2=Math.max.apply(null,Object.keys(lk).map(function(k){return lk[k]}).concat([1]));
  var khach={};ps.forEach(function(p){if(p.SDT)khach[p.SDT]=1});
  v.innerHTML='<h1>Tổng quan</h1><label class="f" style="max-width:220px;margin-bottom:14px"><span>Tháng</span><input type="month" id="thang" value="'+thang+'"></label>'+
   '<div class="stats"><div class="stat"><b>'+C.tien(dt).replace("đ","")+'</b><span>Doanh thu (đ)</span></div><div class="stat"><b>'+C.tien(dt-thu).replace("đ","")+'</b><span>Còn phải thu (đ)</span></div><div class="stat"><b>'+ms.length+'</b><span>Món · '+ps.length+' phiếu</span></div><div class="stat"><b>'+Object.keys(khach).length+'</b><span>Khách có Zalo</span></div></div>'+
   '<h2>Khách ngoài trên doanh thu</h2><div class="card"><div class="bars"><div class="b"><span>Khách ngoài</span><div class="tr"><i style="width:'+tl+'%"></i></div><span class="mono">'+tl+'%</span></div></div><p class="goal">Mục tiêu ≥ 75% (Tóm tắt – Care, định hướng 30/10/2026).</p></div>'+
   '<h2>Theo loại khách</h2><div class="card bars">'+(Object.keys(lk).length?Object.keys(lk).map(function(k){return '<div class="b"><span>'+E(k)+'</span><div class="tr"><i style="width:'+Math.round(lk[k]*100/mx2)+'%"></i></div><span class="mono">'+C.tien(lk[k])+'</span></div>'}).join(""):'<span class="muted">Chưa có dữ liệu</span>')+'</div>'+
   '<h2>Theo dịch vụ</h2><div class="card bars">'+(Object.keys(nhom).length?Object.keys(nhom).sort(function(a,b){return nhom[b]-nhom[a]}).map(function(k){return '<div class="b"><span>'+E(k)+'</span><div class="tr"><i style="width:'+Math.round(nhom[k]*100/mx)+'%"></i></div><span class="mono">'+C.tien(nhom[k])+'</span></div>'}).join(""):'<span class="muted">Chưa có dữ liệu</span>')+'</div>'+
   '<h2>Chất lượng</h2><div class="card sum"><span>Trả đúng hẹn</span><span class="mono">'+(daTra.length?Math.round(dung*100/daTra.length)+'% ('+dung+'/'+daTra.length+')':'–')+'</span><span>Món có sự cố</span><span class="mono">'+(ms.length?(Math.round(suco*1000/ms.length)/10)+'% ('+suco+')':'–')+'</span><span>Tiền đền bù</span><span class="mono">'+C.tien(denBu)+'</span><span>Chi gửi xưởng</span><span class="mono">'+C.tien(xuong)+'</span></div>'+
   '<p class="muted" style="font-size:13px">Tính theo ngày nhận đồ, không gồm phiếu huỷ. Số liệu đầy đủ ở Sheet “CHÉRIE Care · Quản lý”.</p>';
  $("#thang").onchange=function(){thang=this.value||thang;veTong(v)}}

/* ---------- CÀI ĐẶT ---------- */
function caiDat(){var s=sheet(ME.ten+" · "+ME.vaiTro,'<div class="form">'+(owner()?
  '<h2 style="margin:0">Nhân sự <button class="btn soft sm" data-a="nv">Thêm</button></h2><div class="list">'+(D.nhanSu||[]).map(function(n){return '<button class="it" data-nv="'+E(n.MaNV)+'"><div class="r1"><div><div class="t">'+E(n.Ten)+'</div><div class="s">'+E(n.VaiTro)+(n.coPin?'':' · chưa có PIN')+'</div></div>'+(n.Nghi==="Có"?tt("Đã nghỉ").replace("lam","tra"):'')+'</div></button>'}).join("")+'</div>'+
  '<h2>Bảng giá <button class="btn soft sm" data-a="gia">Thêm</button></h2><div class="list">'+D.gia.map(function(g){return '<button class="it" data-gia="'+E(g.MaGia)+'"><div class="r1"><div><div class="t">'+E(g.DichVu)+'</div><div class="s">'+E(g.Nhom)+' · '+E(g.ThoiGianLam||"")+(g.HienWeb==="Không"?' · ẩn trên web':'')+'</div></div><span class="mono">'+E(C.khoangGia(g.GiaTu,g.GiaDen))+'</span></div></button>'}).join("")+'</div>'+
  '<a class="btn quiet" href="https://docs.google.com/spreadsheets/d/14q-LysI0cKpZFfei0DTEiu3R8ygfF5ZdLDJq7XV8FfA/edit" target="_blank" rel="noopener">Mở Sheet dữ liệu</a><a class="btn quiet" href="../" target="_blank" rel="noopener">Xem trang khách</a>':'')+
  '<button class="btn danger" data-a="out">Đăng xuất</button></div>');
  var a=function(k){return $('[data-a="'+k+'"]',s)};
  a("out").onclick=function(){C.call("logout").catch(function(){});C.saveAuth("",null);location.reload()};
  if(!owner())return;
  var nv=function(n){n=n||{};hoi(n.MaNV?"Sửa "+n.Ten:"Thêm nhân sự",'<label class="f"><span>Tên</span><input name="Ten" value="'+E(n.Ten||"")+'" required></label><label class="f"><span>Vai trò</span><select name="VaiTro">'+["Quầy","Kỹ thuật viên","Thợ may","Chủ tiệm"].map(function(x){return '<option'+(x===n.VaiTro?' selected':'')+'>'+x+'</option>'}).join("")+'</select></label>'+
    '<label class="f"><span>'+(n.MaNV?'Mã PIN mới (để trống nếu giữ)':'Mã PIN (4–8 số)')+'</span><input name="PIN" inputmode="numeric" maxlength="8"></label><label class="f"><span>Số điện thoại</span><input name="SDT" type="tel" value="'+E(n.SDT||"")+'"></label>'+
    (n.MaNV?'<label class="f"><span>Tình trạng</span><select name="Nghi"><option value="">Đang làm</option><option value="Có"'+(n.Nghi==="Có"?' selected':'')+'>Đã nghỉ (khoá đăng nhập)</option></select></label>':'')).then(function(o){if(!o)return;o.MaNV=n.MaNV;C.call("luuNhanSu",{obj:o}).then(function(r){D.nhanSu=r.nhanSu;C.toast("Đã lưu "+o.Ten);s.close();setTimeout(caiDat,200)},loi)})};
  a("nv").onclick=function(){nv()};$$("[data-nv]",s).forEach(function(b){b.onclick=function(){nv(D.nhanSu.filter(function(x){return x.MaNV===b.dataset.nv})[0])}});
  var gia=function(g){g=g||{};hoi(g.MaGia?"Sửa giá":"Thêm dịch vụ",'<label class="f"><span>Nhóm</span><input name="Nhom" list="nhomL" value="'+E(g.Nhom||"")+'" required><datalist id="nhomL"><option>Hấp lấy liền</option><option>Giặt và hấp</option><option>Sửa đồ</option><option>Gói</option><option>Nội bộ</option></datalist></label><label class="f"><span>Dịch vụ</span><input name="DichVu" value="'+E(g.DichVu||"")+'" required></label>'+
    '<div class="row2"><label class="f"><span>Giá từ (đ)</span><input name="GiaTu" inputmode="numeric" class="mono" value="'+E(C.num(g.GiaTu)||"")+'"></label><label class="f"><span>Giá đến (đ)</span><input name="GiaDen" inputmode="numeric" class="mono" value="'+E(C.num(g.GiaDen)||"")+'"></label></div>'+
    '<div class="row2"><label class="f"><span>Số ngày làm</span><input name="SoNgay" inputmode="numeric" value="'+E(g.SoNgay||"")+'"></label><label class="f"><span>Đơn vị</span><input name="DonVi" value="'+E(g.DonVi||"món")+'"></label></div>'+
    '<label class="f"><span>Thời gian ghi trên web</span><input name="ThoiGianLam" value="'+E(g.ThoiGianLam||"")+'"></label><label class="f"><span>Ghi chú</span><input name="GhiChu" value="'+E(g.GhiChu||"")+'"></label>'+
    '<label class="f"><span>Hiện trên web</span><select name="HienWeb"><option>Có</option><option'+(g.HienWeb==="Không"?' selected':'')+'>Không</option></select></label>').then(function(o){if(!o)return;o.MaGia=g.MaGia;C.call("luuGia",{obj:o}).then(function(r){D.gia=r.gia;C.toast("Đã lưu bảng giá");s.close();setTimeout(caiDat,200)},loi)})};
  a("gia").onclick=function(){gia()};$$("[data-gia]",s).forEach(function(b){b.onclick=function(){gia(D.gia.filter(function(x){return x.MaGia===b.dataset.gia})[0])}})}

/* ---------- IN TEM TREO 50 × 90 mm ---------- */
function qrSvg(text){try{if(!window.qrcode)return"";var q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:3,margin:0,scalable:true})}catch(e){return""}}
function inTem(ma){var p=phieu(ma),ms=monCua(ma).filter(function(m){return m.TrangThai!=="Đã trả"});if(!ms.length)ms=monCua(ma);
  var link=C.SITE+"?tra="+ma,qr=qrSvg(link),duoi=String(p.SDT||"").slice(-3);
  $("#printArea").innerHTML='<div class="prbar"><button class="btn" id="prGo">In</button><button class="btn quiet" id="prX">Đóng</button></div><div class="tems">'+ms.map(function(m){return '<div class="tem"><div class="hole"></div><span class="lk" style="font-size:12pt;flex-direction:column;gap:1.5mm"><span class="w">CHÉRIE</span><span class="d"></span><span class="b" style="font-size:.5em">Care</span></span>'+
   '<div class="code">'+E(m.MaMon)+'</div><div class="nm">'+E(m.TenMon)+'<br><b>'+E(m.DichVu)+'</b></div><div class="hen">Hẹn trả<br><b>'+E(C.ngayDep(p.HenTra))+'</b></div>'+(qr?'<div class="qr">'+qr+'</div>':'')+
   '<div class="ft">Phiếu '+E(ma)+(duoi?' · Zalo ···'+E(duoi):'')+'<br>Tra đơn: cherie.io.vn/care</div></div>'}).join("")+'</div>';
  var pa=$("#printArea");pa.style.cssText="display:block;position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:12px";
  $("#prGo").onclick=function(){window.print()};$("#prX").onclick=function(){pa.style.cssText="";pa.innerHTML=""}}

/* ---------- bắt đầu ---------- */
if(!window.CARE_API||!C.token())gate();else start();
})();
</script>
